; Retrodeck settings for SimCopter, read by the patched SimCopter.exe when it starts (README "Picture", "Frame rate").
[SimCopter]
; Screen: 0 = 1280x800 (fills the Steam Deck; SimCopterX's layout for the cockpit, hangar and map),
;         1 = 640x480 (the original, shown 4:3 with black bars), 3 = 1024x768 (4:3),
;         2 = 1280x720 (16:9; on the Deck: bars above and below)
Screen=0
; FrameRate: frames a second the game is held to (a sleeping limiter); 0 = no limit
FrameRate=30
